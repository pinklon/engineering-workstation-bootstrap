name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation dependencies
        run: brew install shellcheck ripgrep

      - name: Validate repository
        id: validate
        shell: bash
        run: |
          set -o pipefail
          mkdir -p validation-output
          bash validation/validate.sh 2>&1 | tee validation-output/validate.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostics
          path: validation-output/validate.log
          if-no-files-found: error
          retention-days: 14
