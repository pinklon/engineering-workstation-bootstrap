name: issue-20-repair

on:
  push:
    branches:
      - codex/issue-20-connector-hardening

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-20-connector-hardening
          fetch-depth: 0

      - name: Apply bounded connector hardening repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'lib/connector_fabric.py',
              """        checks['fail_closed'] = (bool(forbidden) and not set(forbidden).intersection(names)\n                                 and client.rejects_unconfigured_write(forbidden[0]))\n""",
              """        checks['fail_closed'] = (bool(forbidden) and not set(forbidden).intersection(names)\n                                 and all(client.rejects_unconfigured_write(name) for name in forbidden))\n""",
          )

          replace_once(
              'lib/connector_client.py',
              """        if forbidden and not set(forbidden).intersection(names):\n            checks['fail_closed'] = reader.rejects_unconfigured_write(forbidden[0])\n""",
              """        if forbidden and not set(forbidden).intersection(names):\n            checks['fail_closed'] = all(reader.rejects_unconfigured_write(name) for name in forbidden)\n""",
          )

          replace_once(
              'lib/connector_fabric.py',
              """                expected_auth = c.get('bearer_token_env_var')\n                if expected_auth and existing[name].get('bearer_token_env_var') != expected_auth:\n                    raise Refusal('required connector authentication reference mismatch')\n                continue\n""",
              """                expected_auth = c.get('bearer_token_env_var')\n                if expected_auth and existing[name].get('bearer_token_env_var') != expected_auth:\n                    raise Refusal('required connector authentication reference mismatch')\n                if existing[name].get('http_headers'):\n                    raise Refusal('required connector literal headers refused')\n                continue\n""",
          )

          tests = Path('lib/connector_fabric_tests.py')
          text = tests.read_text()
          anchor = "    def test_complete_matrix_and_required_admission(self):\n"
          if text.count(anchor) != 1:
              raise SystemExit('test insertion anchor mismatch')
          addition = textwrap.indent(textwrap.dedent(r'''
          def test_all_forbidden_tools_receive_independent_negative_calls(self):
              self.connector['forbidden_tools'] = ['create_issue', 'delete_file']
              calls = []

              def reject(_client, name):
                  calls.append(name)
                  return True

              with patch.object(fabric.MCP, 'rejects_unconfigured_write', autospec=True, side_effect=reject):
                  row, _ = self.probe()
              self.assertTrue(row['qualified'])
              self.assertEqual(calls, ['create_issue', 'delete_file'])

          def test_any_non_rejecting_forbidden_tool_fails_qualification(self):
              self.connector['forbidden_tools'] = ['create_issue', 'delete_file']

              def reject(_client, name):
                  return name == 'create_issue'

              with patch.object(fabric.MCP, 'rejects_unconfigured_write', autospec=True, side_effect=reject):
                  row, _ = self.probe()
              self.assertFalse(row['checks']['fail_closed'])
              self.assertFalse(row['qualified'])

          def test_native_client_checks_every_forbidden_tool(self):
              self.connector['forbidden_tools'] = ['create_issue', 'delete_file']
              calls = []

              class Client:
                  identity = {'thread_id': 'fixture-native-thread', 'pid': 1}
                  servers = {'fixture': {'runtimeStatus': 'connected', 'tools': {'read': {}}}}

                  def call(self, server, tool, arguments):
                      calls.append(tool)
                      if tool == 'read':
                          return {'content': [{'type': 'text', 'text': 'bounded fixture read'}]}
                      if tool == 'create_issue':
                          raise fabric.RPCRefusal(-32601)
                      return {'content': [{'type': 'text', 'text': 'unexpected mutation surface'}]}

              row = native.observe(Client(), self.connector, 'codex-cli')
              self.assertFalse(row['checks']['fail_closed'])
              self.assertFalse(row['qualified'])
              self.assertIn('create_issue', calls)
              self.assertIn('delete_file', calls)

          def test_render_rejects_literal_headers_on_existing_required_connector(self):
              source = self.home / 'config.toml'
              source.write_text(
                  '[mcp_servers.github-readonly]\n'
                  'url = "https://api.githubcopilot.com/mcp/x/all/readonly"\n'
                  'enabled = true\n'
                  'bearer_token_env_var = "GH_TOKEN"\n'
                  '[mcp_servers.github-readonly.http_headers]\n'
                  'Authorization = "opaque-literal"\n'
              )
              target = self.home / 'candidate'
              result = self.cli('render', '--source', str(source), '--output', str(target))
              self.assertEqual(result.returncode, 64)
              self.assertFalse(target.exists())
              self.assertNotIn('opaque-literal', result.stdout + result.stderr)

          ''').lstrip('\n'), '    ')
          tests.write_text(text.replace(anchor, addition + anchor, 1))

          Path('.github/workflows/issue-20-repair.yml').unlink()
          PY

      - name: Run focused regression suite
        shell: bash
        run: |
          git diff --check
          python3 lib/connector_fabric_tests.py

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/connector_fabric.py lib/connector_client.py lib/connector_fabric_tests.py .github/workflows/issue-20-repair.yml
          git commit -m "fix: harden connector fail-closed boundaries (#20)"
          git push origin HEAD:codex/issue-20-connector-hardening
