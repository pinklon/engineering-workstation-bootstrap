name: GitHub auth doctor fixtures

on:
  pull_request:
    paths:
      - bin/github-auth-doctor
      - lib/github_auth_doctor.py
      - validation/github-auth-doctor-fixtures.py
      - docs/GITHUB-AUTH-DOCTOR.md
      - .github/workflows/github-auth-doctor.yml
  push:
    branches: [main]
    paths:
      - bin/github-auth-doctor
      - lib/github_auth_doctor.py
      - validation/github-auth-doctor-fixtures.py
      - docs/GITHUB-AUTH-DOCTOR.md
      - .github/workflows/github-auth-doctor.yml

permissions:
  contents: read

jobs:
  offline-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test nonmutating GitHub observations with local doubles
        run: python3 -B validation/github-auth-doctor-fixtures.py
